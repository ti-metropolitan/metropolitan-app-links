<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Sponte — Colégio Metropolitan</title>
<script>
(function () {
  var ua = navigator.userAgent || "";
  var android = /Android/i.test(ua);
  var iphone = /iPhone|iPad|iPod/i.test(ua);
  var play = "https://play.google.com/store/apps/details?id=br.com.sponte.sponteapp";
  var appStore = "https://apps.apple.com/br/app/sponte-agenda-plus/id1636538135";
  if (android) location.replace(play);
  else if (iphone) location.replace(appStore);
  else document.addEventListener("DOMContentLoaded", function () {
    document.getElementById("links").innerHTML =
      '<a href="' + play + '">Google Play (Android)</a><br><a href="' + appStore + '">App Store (iPhone)</a>';
  });
})();
</script>
<style>body{font-family:Arial,sans-serif;text-align:center;padding:48px 20px;color:#10284a}a{display:inline-block;margin:12px;color:#10284a}</style>
</head>
<body><h1>Sponte</h1><p>Redirecionando para a loja do seu celular…</p><div id="links"></div></body>
</html>
