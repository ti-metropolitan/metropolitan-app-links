.app{height:190px;background:#fff;border:1px solid #dbe5ef;border-radius:22px;display:grid;place-items:center;text-decoration:none;box-shadow:0 8px 24px #10284a12;transition:transform .2s}
.app:hover{transform:translateY(-4px)}.app svg{width:116px;height:116px;display:block}
.footer{margin-top:28px;color:#8291a2;font-size:12px}
@media(max-width:600px){.apps{gap:9px}.app{height:120px;border-radius:15px}.app svg{width:72px;height:72px}}
