<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#10284a">
<title>Aplicativos | Colégio Metropolitan</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(180deg,#f4f8fc 0%,#fff 100%);color:#10284a;display:flex;align-items:center;justify-content:center;padding:36px 18px}
main{width:min(900px,100%);text-align:center}
.brand{font-size:13px;font-weight:700;letter-spacing:2.4px;text-transform:uppercase;color:#ed1f3d;margin-bottom:14px}
h1{font-size:clamp(27px,4vw,38px);margin:0 0 38px;color:#10284a}
.apps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
.app{display:flex;align-items:center;justify-content:center;min-height:190px;padding:25px;background:#fff;border:1px solid #dbe5ef;border-radius:22px;text-decoration:none;box-shadow:0 8px 24px rgba(16,40,74,.07);transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease}
.app:hover{transform:translateY(-4px);border-color:#a9bfd5;box-shadow:0 14px 30px rgba(16,40,74,.12)}
.app img{width:112px;height:112px;object-fit:contain;border-radius:24px}
.footer{font-size:12px;color:#8291a2;margin-top:30px}
@media(max-width:640px){body{padding:28px 16px}.apps{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.app{min-height:112px;padding:12px;border-radius:16px}.app img{width:min(100%,76px);height:auto;aspect-ratio:1;border-radius:17px}}
</style>
</head>
<body>
<main>
<div class="brand">Colégio Metropolitan</div>
<h1>Aplicativos da escola</h1>
<section class="apps" aria-label="Aplicativos">
<a class="app" href="./sponte/" aria-label="Sponte"><img src="https://is1-ssl.mzstatic.com/image/thumb/Purple211/v4/0b/24/86/0b24867d-e57b-25fd-a290-b140c45fee0f/AppIcon-0-0-1x_U007ephone-0-1-85-220.png/1200x630wa.png" alt="Logo Sponte"></a>
<a class="app" href="./plurall/" aria-label="Plurall"><img src="https://is1-ssl.mzstatic.com/image/thumb/Purple221/v4/01/0a/95/010a9507-0e41-1424-a8c3-55ef46a335e9/AppIcon-0-0-1x_U007emarketing-0-11-0-85-220.png/640x640bb.webp" alt="Logo Plurall"></a>
<a class="app" href="./gmail/" aria-label="Gmail"><img src="https://images.macrumors.com/t/x6elVK6gMH6VS6EKP6SrKodTWHI%3D/1600x900/smart/article-new/2022/07/gmail-icon.png" alt="Logo Gmail"></a>
</section>
<p class="footer">Colégio Metropolitan</p>
</main>
</body>
</html>
