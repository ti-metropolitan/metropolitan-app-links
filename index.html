<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#10284a">
<title>Aplicativos | Colégio Metropolitan</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:28px 16px;background:#f4f8fc;font-family:Arial,sans-serif;color:#10284a}
main{width:min(900px,100%);text-align:center}
.brand{color:#ed1f3d;font-weight:700;letter-spacing:2px;font-size:13px;text-transform:uppercase}
h1{font-size:clamp(26px,4vw,34px);margin:14px 0 34px}
.apps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.app{min-height:190px;padding:20px 14px;background:#fff;border:1px solid #dbe5ef;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:13px;text-decoration:none;color:#10284a;font-weight:700;font-size:17px;box-shadow:0 8px 24px #10284a12;transition:transform .2s,border-color .2s}
.app:hover{transform:translateY(-4px);border-color:#ed1f3d}
.app img{width:112px;height:112px;display:block;object-fit:contain;object-position:center}
.footer{margin-top:28px;color:#8291a2;font-size:12px}
@media(max-width:600px){.apps{gap:9px}.app{min-height:145px;padding:12px 6px;border-radius:15px;gap:9px;font-size:14px}.app img{width:76px;height:76px}}
</style></head>
<body><main><div class="brand">Colégio Metropolitan</div><h1>Aplicativos da escola</h1>
<section class="apps" aria-label="Aplicativos">
<a class="app" href="./sponte/" aria-label="Abrir Sponte">
<img src="./assets/Sponte.png" alt="Logo original do Sponte" width="112" height="112">
<span>Sponte</span>
</a>
<a class="app" href="./gmail/" aria-label="Abrir Gmail">
<img src="./assets/Gmail.png" alt="Logo original do Gmail" width="112" height="112">
<span>Gmail</span>
</a>
<a class="app" href="./plurall/" aria-label="Abrir Plurall">
<img src="./assets/Plurall.png" alt="Logo original do Plurall" width="112" height="112">
<span>Plurall</span>
</a>
</section><p class="footer">Colégio Metropolitan</p></main></body></html>
